profile_name: attention_lstm_experiment
description: LSTM with Bahdanau sequence attention mechanism
model:
  architecture: attention_lstm
  lstm_hidden_dim1: 64
  lstm_hidden_dim2: 32
  attention_dim: 32
  dropout: 0.2
loss:
  name: pinball
  pinball_quantile: 0.35
training:
  epochs: 35
  batch_size: 64
  learning_rate: 0.001
  optimizer: adam
