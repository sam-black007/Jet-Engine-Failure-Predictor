name: THRUSTLAB Continuous Integration & Quality Assurance

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-backend:
    name: Backend Test Suite & Code Quality
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint and Code Syntax Validation
        run: |
          python -m py_compile src/*.py dashboard/*.py

      - name: Execute Pytest Backend Suite (79 Tests)
        run: |
          python -m pytest tests/ -v --ignore=tests/test_dashboard_playwright.py

  test-e2e-playwright:
    name: Playwright Chromium Browser Automation
    runs-on: ubuntu-latest
    needs: test-backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Start Streamlit Dashboard in Background
        run: |
          python -m streamlit run dashboard/app.py --server.headless true --server.port 8501 &
          sleep 5

      - name: Run Playwright E2E Browser Suite
        run: |
          python run_playwright_suite.py

      - name: Upload Playwright Test Screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-screenshots
          path: results/playwright/
          retention-days: 7

  docker-build-validation:
    name: Docker Container Build & Health Validation
    runs-on: ubuntu-latest
    needs: test-backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: thrustlab-ai:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
